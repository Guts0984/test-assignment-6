name: CI
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false # history of runs must be kept; never cancel

env:
  # The Playwright image the screenshot baselines were made in. Keep it equal to the installed
  # @playwright/test version (package.json), or browsers and baselines drift.
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.0-noble

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test:unit

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: calendar
          POSTGRES_PASSWORD: calendar_dev_password
          POSTGRES_DB: calendar
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U calendar" --health-interval 3s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm test:int

  storybook:
    # Builds Storybook and runs every story's play function (the interaction tests) in a real browser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'
      - name: Serve the static build and run the interaction tests
        run: |
          python3 -m http.server 6006 -d storybook-static >/dev/null 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:6006/index.json >/dev/null && break; sleep 1; done
          pnpm test-storybook

  e2e:
    # One real stack (docker compose: migrations + seed run by the web container), then, against that
    # same stack: e2e three times in a row in three browsers, screenshot tests, bundle size, Lighthouse.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Start the stack
        run: |
          docker compose up --build -d
          for _ in $(seq 1 90); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login || true)" = "200" ] && exit 0
            sleep 2
          done
          docker compose logs --no-color web | tail -60
          exit 1
      - name: e2e, 3 runs in a row, Chromium + Firefox + WebKit
        run: |
          for run in 1 2 3; do
            echo "::group::e2e run $run"
            docker run --rm --network host --ipc=host -v "$PWD":/work -w /work \
              -e BASE_URL=http://localhost:3000 -e CI=1 "$PLAYWRIGHT_IMAGE" \
              npx playwright test
            echo "::endgroup::"
          done
      - name: Screenshot tests (3 browsers x light/dark)
        run: |
          docker run --rm --network host --ipc=host -v "$PWD":/work -w /work \
            -e BASE_URL=http://localhost:3000 -e CI=1 "$PLAYWRIGHT_IMAGE" \
            npx playwright test -c playwright.screenshots.config.ts
      - name: First-load JavaScript budget (<= 200 KB gzip)
        run: |
          pnpm exec playwright install --with-deps chromium
          node scripts/measure-js.mjs http://localhost:3000 --budget=200
      - name: Lighthouse CI (performance >= 90, accessibility = 100)
        run: node scripts/lighthouse.mjs http://localhost:3000
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            playwright-report
            test-results
            .lighthouseci
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs --no-color web | tail -100
      - if: always()
        run: docker compose down -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: ./scripts/ci-docker-check.sh
      - if: always()
        run: docker compose down -v
